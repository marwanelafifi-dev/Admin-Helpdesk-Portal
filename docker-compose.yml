name: company-portal

services:

  db:
    image: postgres:16-alpine
    container_name: company-portal-db
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env.local}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.local}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env.local}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - helpdesk-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?Set DB_USER} -d ${DB_NAME:?Set DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  app:
    build:
      context: .
      dockerfile: Dockerfile
        # Build-time vars — required by next build for auth config validation.
    container_name: company-portal-app
    env_file:
      - .env.local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:?Set DB_USER}:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/${DB_NAME:?Set DB_NAME}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Set NEXTAUTH_URL to the public HTTPS URL}
      AUTH_URL: ${AUTH_URL:-${NEXTAUTH_URL:?Set NEXTAUTH_URL to the public HTTPS URL}}
      AUTH_TRUST_HOST: "true"
      # Use the safe migration history in normal deployments. Set to `push`
      # only for an existing local development database that predates Prisma
      # migration tracking.
      PRISMA_MIGRATION_MODE: ${PRISMA_MIGRATION_MODE:-deploy}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      ENABLE_GOOGLE_AUTH: "true"
      NODE_ENV: production
      TZ: Africa/Cairo
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ~/admin-helpdesk-data:/app/data
    ports:
      - "127.0.0.1:${APP_PORT:-3003}:3003"
    networks:
      - helpdesk-net
    # Port-open check instead of HTTP GET — once redirects target the public
    # NEXTAUTH_URL (different host), wget treats it as an error and would
    # report the container unhealthy even though the app is fine.
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3003"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: always

  # Cloudflare Tunnel — makes app accessible from anywhere
  # To activate: set CLOUDFLARE_TUNNEL_TOKEN in .env.local
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: company-portal-tunnel
    restart: always
    command:
      - tunnel
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - helpdesk-net
    profiles:
      - tunnel

volumes:
  postgres_data:
    driver: local

networks:
  helpdesk-net:
    driver: bridge
